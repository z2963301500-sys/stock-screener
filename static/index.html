<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选股小程序</title>
<style>
:root {
    --up: #e03a3a; --down: #1aad19; --bg: #f0f2f5; --card-bg: #ffffff;
    --text: #1a1a2e; --text-secondary: #6b7280; --border: #e5e7eb;
    --primary: #2563eb; --primary-hover: #1d4ed8;
    --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; line-height: 1.5;
}

/* ── Header ── */
.app-header {
    background: var(--card-bg); padding: 0 24px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 100;
}
.app-title { font-size: 1.15rem; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; }
.app-nav { display: flex; gap: 2px; height: 100%; align-items: center; }
.nav-link {
    text-decoration: none; color: var(--text-secondary); padding: 6px 16px;
    border-radius: 8px; font-size: 0.875rem; font-weight: 500; transition: all 0.2s;
}
.nav-link:hover { background: var(--bg); color: var(--text); }
.nav-link.active { background: var(--primary); color: #fff; }

/* ── Main Content ── */
#app-content { flex: 1; padding: 24px; max-width: 1100px; margin: 0 auto; width: 100%; }

/* ── Footer ── */
.app-footer {
    text-align: center; padding: 14px; color: var(--text-secondary);
    font-size: 0.75rem; border-top: 1px solid var(--border); background: var(--card-bg);
}

/* ── Cards ── */
.card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px; margin-bottom: 16px;
    border: 1px solid var(--border);
}

/* ── Filter Area ── */
.filter-row {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
}
.filter-group { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
.filter-group > label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
.filter-group select, .filter-group input[type=number] {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.85rem; background: #fff; color: var(--text); height: 38px;
}
.filter-group select:focus, .filter-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

/* ── Param Sliders ── */
.params-area { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; }
.param-item { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
.param-item label { font-size: 0.78rem; color: var(--text-secondary); font-weight: 600; }
.param-item .param-row { display: flex; align-items: center; gap: 8px; }
.param-item input[type=range] { flex: 1; accent-color: var(--primary); height: 6px; }
.param-item .param-val { font-size: 0.8rem; color: var(--primary); font-weight: 700; min-width: 42px; text-align: right; }

/* ── Buttons ── */
.btn {
    padding: 9px 22px; border: none; border-radius: 8px; font-size: 0.875rem;
    cursor: pointer; font-weight: 600; transition: all 0.2s; height: 38px;
    display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(37,99,235,0.25); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── Spinner ── */
.spinner {
    display: inline-block; width: 22px; height: 22px;
    border: 2.5px solid var(--border); border-top-color: var(--primary);
    border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 48px 20px; color: var(--text-secondary); font-size: 0.9rem; }

/* ── Stats Bar ── */
.stats-bar {
    display: flex; gap: 24px; padding: 12px 16px; background: #f8fafc;
    border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; flex-wrap: wrap;
    border: 1px solid var(--border);
}
.stats-bar .stat-item { display: flex; align-items: center; gap: 6px; }
.stats-bar .stat-label { color: var(--text-secondary); }
.stats-bar .stat-value { color: var(--text); font-weight: 700; }

/* ── Table ── */
.table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
.result-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.result-table thead { background: #f8fafc; }
.result-table th {
    padding: 10px 14px; text-align: left; font-weight: 600;
    color: var(--text-secondary); border-bottom: 2px solid var(--border);
    cursor: pointer; user-select: none; white-space: nowrap; font-size: 0.8rem;
}
.result-table th:hover { color: var(--primary); }
.result-table td { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; white-space: nowrap; }
.result-table tbody tr { cursor: pointer; transition: background 0.15s; }
.result-table tbody tr:hover { background: #eff6ff; }
.result-table tbody tr:last-child td { border-bottom: none; }

.price-up { color: var(--up); font-weight: 600; }
.price-down { color: var(--down); font-weight: 600; }

.score-cell { display: flex; align-items: center; gap: 8px; }
.score-bar {
    width: 48px; height: 6px; border-radius: 3px; flex-shrink: 0;
    background: linear-gradient(90deg, #e5e7eb 0%, #f59e0b 55%, #e03a3a 100%);
}
.score-num { font-weight: 700; font-size: 0.85rem; }

.badge {
    display: inline-block; padding: 3px 10px; border-radius: 12px;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.3px;
}
.badge-strong { background: #fef2f2; color: #dc2626; }
.badge-moderate { background: #fffbeb; color: #d97706; }
.badge-weak { background: #f0fdf4; color: #16a34a; }

/* ── Detail Page ── */
.detail-header {
    display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
}
.back-link { color: var(--primary); text-decoration: none; font-size: 0.9rem; cursor: pointer; font-weight: 500; }
.back-link:hover { text-decoration: underline; }
.stock-name { font-size: 1.4rem; font-weight: 700; }
.stock-code { font-size: 0.85rem; color: var(--text-secondary); background: var(--bg); padding: 2px 8px; border-radius: 4px; }
.stock-price { font-size: 1.2rem; font-weight: 700; }
.stock-change { font-size: 0.85rem; font-weight: 600; }

.chart-container { width: 100%; height: 380px; margin-bottom: 12px; }
.chart-sub { width: 100%; height: 130px; margin-bottom: 12px; }

.indicator-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.indicator-card { background: #f8fafc; border-radius: 8px; padding: 14px 10px; text-align: center; border: 1px solid var(--border); }
.indicator-card .ind-label { font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
.indicator-card .ind-value { font-size: 1.1rem; font-weight: 700; }

/* ── Weight Sliders ── */
.weight-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.weight-item { display: flex; flex-direction: column; gap: 6px; }
.weight-item .weight-header { display: flex; justify-content: space-between; align-items: center; }
.weight-item .weight-header label { font-size: 0.85rem; font-weight: 600; }
.weight-item .weight-val { font-size: 0.85rem; color: var(--primary); font-weight: 700; }
.weight-item input[type=range] { accent-color: var(--primary); width: 100%; }

/* ── Section Title ── */
.section-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; display: inline-block; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

/* ── Error / Empty ── */
.error-msg { padding: 32px 20px; background: #fef2f2; color: #dc2626; border-radius: 8px; text-align: center; border: 1px solid #fecaca; }
.empty-msg { padding: 48px 20px; text-align: center; color: var(--text-secondary); font-size: 0.9rem; }
.error-msg a { color: var(--primary); font-weight: 600; }

/* ── About Page ── */
.about-card { max-width: 580px; }
.about-card h2 { margin-bottom: 14px; font-size: 1.2rem; }
.about-card p, .about-card li { color: var(--text-secondary); line-height: 1.9; }
.about-card ul { margin: 8px 0 8px 20px; }
.about-card .disclaimer { margin-top: 16px; padding: 12px; background: #fffbeb; border-radius: 6px; font-size: 0.85rem; border: 1px solid #fde68a; }

/* ── Mobile ── */
@media (max-width: 768px) {
    .app-header { height: auto; padding: 10px 14px; flex-direction: column; gap: 8px; }
    #app-content { padding: 12px; }
    .filter-row { flex-direction: column; }
    .filter-group { min-width: auto; }
    .params-area { flex-direction: column; gap: 10px; }
    .result-table thead { display: none; }
    .result-table tr { display: block; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; background: var(--card-bg); }
    .result-table td { display: flex; justify-content: space-between; padding: 5px 0; border: none; font-size: 0.8rem; }
    .result-table td::before { content: attr(data-label); font-weight: 600; color: var(--text-secondary); }
    .detail-header { gap: 8px; }
    .chart-container { height: 250px; }
    .chart-sub { height: 100px; }
    .indicator-grid { grid-template-columns: repeat(3, 1fr); }
    .weight-grid { grid-template-columns: 1fr; }
    .stats-bar { gap: 12px; }
}
</style>
</head>
<body>
<header class="app-header">
    <h1 class="app-title">📊 选股小程序</h1>
    <nav class="app-nav" id="app-nav">
        <a href="#screener" class="nav-link active">技术筛选</a>
        <a href="#multifactor" class="nav-link">多因子评分</a>
        <a href="#about" class="nav-link">关于</a>
    </nav>
</header>
<main id="app-content"><div class="loading-overlay"><div class="spinner"></div>加载中...</div></main>
<footer class="app-footer">数据来源 akshare · 仅供参考，不构成投资建议</footer>

<script>
// ── Global error display ──
window.onerror = function(msg, url, line) {
    var el = document.getElementById('app-content');
    if (el) el.innerHTML = '<div class="error-msg"><b>脚本错误</b><br>'+msg+'<br><small>第 '+line+' 行</small></div>';
};
window.onunhandledrejection = function(e) {
    var el = document.getElementById('app-content');
    if (el) el.innerHTML = '<div class="error-msg"><b>异步错误</b><br>'+e.reason+'</div>';
};

// ── Pre-built strategy data (no API dependency for initial render) ──
var PARAM_LABELS = {
    ma_period: '均线周期', band: '偏离阈值', period: '计算周期',
    vol_ma: '均量周期', price_lb: '突破周期', lookback: '回溯天数'
};

var BUILTIN_STRATEGIES = {
    ma_band:    {label:'MA均线偏离', params:{ma_period:20, band:0.02}},
    rsi_extreme:{label:'RSI超卖',   params:{period:6}},
    volume_breakout:{label:'放量突破', params:{vol_ma:20, price_lb:5}},
    momentum:   {label:'动量强度',   params:{lookback:5}},
    reversal:   {label:'超跌反弹',   params:{lookback:3}},
    gap_fade:   {label:'跳空回补',   params:{}}
};

// ── Utils ──
var API_BASE = '/api';
var AppState = { technicalResults: [], multifactorResults: [], strategies: BUILTIN_STRATEGIES, loading: false };

async function apiGet(path) {
    var res = await fetch(API_BASE + path);
    if (!res.ok) throw new Error(await res.text());
    return res.json();
}
async function apiPost(path, body) {
    var res = await fetch(API_BASE + path, {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
}
function formatPrice(v) { if (v == null) return '-'; return Number(v).toFixed(2); }
function formatPct(v) { if (v == null) return '-'; return (Number(v) > 0 ? '+' : '') + Number(v).toFixed(2) + '%'; }
function formatNum(v) {
    if (v == null) return '-';
    var n = Number(v);
    if (n >= 1e12) return (n / 1e12).toFixed(2) + '万亿';
    if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(2) + '万';
    return n.toFixed(0);
}
function pctClass(v) { if (v == null) return ''; return Number(v) >= 0 ? 'price-up' : 'price-down'; }
function badgeHtml(s) { var m = {strong:'强烈推荐', moderate:'可以考虑', weak:'信号较弱'}; return '<span class="badge badge-'+s+'">'+(m[s]||s)+'</span>'; }
function scoreBarHtml(score) { return '<div class="score-cell"><div class="score-bar" style="width:'+Math.max(6,score*0.48)+'px"></div><span class="score-num">'+Number(score).toFixed(0)+'</span></div>'; }

// ── Charts (dynamic load) ──
var _LC = null, _loadPromise = null;
async function loadLC() {
    if (_LC) return _LC;
    if (_loadPromise) return _loadPromise;
    _loadPromise = (async function() {
        var urls = [
            'https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
            'https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
        ];
        for (var i = 0; i < urls.length; i++) {
            try {
                await new Promise(function(resolve, reject) {
                    var s = document.createElement('script'); s.src = urls[i];
                    s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
                    setTimeout(function() { reject(new Error('超时')); }, 10000);
                });
                if (typeof LightweightCharts !== 'undefined') { _LC = LightweightCharts; return _LC; }
            } catch(e) { continue; }
        }
        console.warn('图表库加载失败'); return null;
    })();
    return _loadPromise;
}
function calcMA(c, p) { var r = []; for (var i = p-1; i < c.length; i++) { var s = 0; for (var j = i-p+1; j <= i; j++) s += c[j].close; r.push({time: c[i].date, value: s/p}); } return r; }
function calcRSI(c, p) {
    if (c.length < p+1) return []; var r = [], g = 0, l = 0;
    for (var i = 1; i <= p; i++) { var d = c[i].close - c[i-1].close; if (d > 0) g += d; else l -= d; }
    var ag = g/p, al = l/p;
    for (var i = p; i < c.length; i++) {
        var rs = al === 0 ? 100 : ag / al; r.push({time: c[i].date, value: 100 - (100/(1+rs))});
        var d = c[i].close - c[i-1].close; ag = (ag*(p-1) + (d>0?d:0)) / p; al = (al*(p-1) + (d<0?-d:0)) / p;
    }
    return r;
}
async function createStockChart(el, candles, ind) {
    var LC = await loadLC(); if (!LC || !el) return;
    var chart = LC.createChart(el, { layout: {background:{color:'#fff'}, textColor:'#333'}, grid: {vertLines:{color:'#f0f0f0'}, horzLines:{color:'#f0f0f0'}}, crosshair: {mode:1}, timeScale: {timeVisible:true, borderColor:'#e5e7eb'}, rightPriceScale: {borderColor:'#e5e7eb'} });
    var cs = chart.addCandlestickSeries({upColor:'#e03a3a',downColor:'#1aad19',borderUpColor:'#e03a3a',borderDownColor:'#1aad19',wickUpColor:'#e03a3a',wickDownColor:'#1aad19'});
    cs.setData(candles.map(function(c){return {time:c.date,open:c.open,high:c.high,low:c.low,close:c.close};}));
    var mc = {ma5:'#f59e0b', ma20:'#8b5cf6', ma60:'#06b6d4'};
    Object.keys(mc).forEach(function(k) { if (ind[k] != null) { var md = calcMA(candles, parseInt(k.replace('ma',''))); if (md.length > 0) { var ls = chart.addLineSeries({color:mc[k],lineWidth:1.5,priceLineVisible:false}); ls.setData(md); } } });
}
async function createVolumeChart(el, candles) {
    var LC = await loadLC(); if (!LC || !el) return;
    var chart = LC.createChart(el, { layout: {background:{color:'#fff'}, textColor:'#333'}, grid: {vertLines:{color:'#f0f0f0'}, horzLines:{color:'#f0f0f0'}}, crosshair: {mode:0}, timeScale: {timeVisible:false}, rightPriceScale: {borderColor:'#e5e7eb'} });
    var vs = chart.addHistogramSeries({color:'#26a69a',priceFormat:{type:'volume'},priceScaleId:''});
    vs.setData(candles.map(function(c){return {time:c.date,value:c.volume,color:c.close>=c.open?'rgba(224,58,58,0.4)':'rgba(26,173,25,0.4)'};}));
}
async function createRSIChart(el, candles, period) {
    period = period || 6; var LC = await loadLC(); if (!LC || !el) return;
    var chart = LC.createChart(el, { layout: {background:{color:'#fff'}, textColor:'#333'}, grid: {vertLines:{color:'#f0f0f0'}, horzLines:{color:'#f0f0f0'}}, crosshair: {mode:0}, timeScale: {timeVisible:false}, rightPriceScale: {borderColor:'#e5e7eb'} });
    var rs = chart.addLineSeries({color:'#7c3aed',lineWidth:1.5}); rs.setData(calcRSI(candles, period));
    [30,70].forEach(function(lv) { var ls = chart.addLineSeries({color:lv===30?'#16a34a':'#dc2626',lineWidth:1,lineStyle:2,priceLineVisible:false}); ls.setData([{time:candles[0].date,value:lv},{time:candles[candles.length-1].date,value:lv}]); });
}

// ── SCREENER PAGE ──
async function renderScreener(container) {
    var strategies = AppState.strategies;
    // Optional: refresh from server in background
    apiGet('/strategies').then(function(d){ AppState.strategies = d; }).catch(function(){});

    var keys = Object.keys(strategies);
    container.innerHTML =
        '<div class="card">'+
        '<div class="section-title">筛选条件</div>'+
        '<div class="filter-row">'+
        '<div class="filter-group"><label>选股策略</label><select id="tech-strategy">'+keys.map(function(k){return '<option value="'+k+'">'+strategies[k].label+'</option>';}).join('')+'</select></div>'+
        '<div class="filter-group"><label>返回数量</label><select id="tech-topn"><option value="20">前 20 名</option><option value="50" selected>前 50 名</option><option value="100">前 100 名</option></select></div>'+
        '<div class="filter-group"><label>&nbsp;</label><button class="btn btn-primary" id="tech-run">🔍 开始筛选</button></div>'+
        '</div>'+
        '<div id="tech-params" class="params-area"></div>'+
        '</div>'+
        '<div id="tech-results"></div>';
    renderTechParams(strategies, keys[0]);
    document.getElementById('tech-strategy').addEventListener('change', function(e){ renderTechParams(strategies, e.target.value); });
    document.getElementById('tech-run').addEventListener('click', runTechScreening);
}
function renderTechParams(strategies, key) {
    var params = strategies[key].params;
    var c = document.getElementById('tech-params');
    if (!params || Object.keys(params).length === 0) { c.innerHTML = ''; return; }
    c.innerHTML = Object.entries(params).map(function(e) {
        var k = e[0], v = e[1], min = 1, max = 100, step = 1;
        if (k === 'ma_period') { min=5;max=60; }
        else if (k === 'band') { min=0.01;max=0.10;step=0.005; }
        else if (k === 'period') { min=4;max=14; }
        else if (k === 'vol_ma') { min=10;max=60; }
        else if (k === 'price_lb') { min=3;max=20; }
        else if (k === 'lookback') { min=2;max=20; }
        var label = PARAM_LABELS[k] || k;
        return '<div class="param-item"><label>'+label+'</label><div class="param-row"><input type="range" id="param-'+k+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+v+'"><span class="param-val" id="param-val-'+k+'">'+v+'</span></div></div>';
    }).join('');
    Object.entries(params).forEach(function(e) {
        var s = document.getElementById('param-'+e[0]), d = document.getElementById('param-val-'+e[0]);
        if (s && d) s.addEventListener('input', function(){ d.textContent = s.value; });
    });
}
async function runTechScreening() {
    var btn = document.getElementById('tech-run'), rd = document.getElementById('tech-results');
    var strategy = document.getElementById('tech-strategy').value;
    var topN = parseInt(document.getElementById('tech-topn').value);
    var info = AppState.strategies[strategy], params = {};
    if (info.params) Object.keys(info.params).forEach(function(k){ var el = document.getElementById('param-'+k); if(el) params[k]=parseFloat(el.value); });
    btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> 筛选中';
    rd.innerHTML = '<div class="card"><div class="loading-overlay"><div class="spinner"></div>正在扫描全市场股票，请稍候...</div></div>';
    try {
        var data = await apiPost('/screen/technical', {strategy:strategy, params:params, top_n:topN, exclude_st:true, min_market_cap:0});
        AppState.technicalResults = data.results;
        renderTechResults(rd, data);
    } catch(e) {
        rd.innerHTML = '<div class="error-msg">筛选请求失败<br><small>'+e.message+'</small></div>';
    } finally {
        btn.disabled = false; btn.innerHTML = '🔍 开始筛选';
    }
}
function renderTechResults(container, data) {
    if (!data.results || data.results.length === 0) { container.innerHTML = '<div class="card"><div class="empty-msg">📭 没有找到符合条件的股票<br><small>试试调整策略参数或换个策略</small></div></div>'; return; }
    container._results = data.results; container._sortKey = 'score'; container._sortDir = -1;
    var headers = [
        {key:'code',label:'代码'},{key:'name',label:'股票名称'},{key:'price',label:'最新价',fmt:formatPrice},
        {key:'change_pct',label:'涨跌幅',fmt:formatPct,cls:pctClass},{key:'score',label:'评分'},
        {key:'indicator_value',label:'指标值'},{key:'signal_strength',label:'信号强度'},
    ];
    function buildTable(results) {
        return '<div class="card">'+
            '<div class="stats-bar"><div class="stat-item"><span class="stat-label">扫描范围</span><span class="stat-value">'+data.total_scanned+' 支股票</span></div><div class="stat-item"><span class="stat-label">符合条件</span><span class="stat-value">'+data.total_matched+' 支</span></div><div class="stat-item"><span class="stat-label">耗时</span><span class="stat-value">'+(data.elapsed_ms/1000).toFixed(1)+' 秒</span></div></div>'+
            '<div class="table-wrapper"><table class="result-table"><thead><tr>'+headers.map(function(h){var arrow=container._sortKey===h.key?(container._sortDir>0?' ▲':' ▼'):'';return '<th data-sort="'+h.key+'">'+h.label+arrow+'</th>';}).join('')+'</tr></thead><tbody>'+
            results.map(function(r){return '<tr data-code="'+r.code+'">'+headers.map(function(h){var val=r[h.key];if(h.key==='score')val=scoreBarHtml(val);else if(h.key==='signal_strength')val=badgeHtml(val);else if(h.fmt)val=h.fmt(val);if(val==null)val='-';var cls=h.cls?h.cls(r[h.key]):'';return '<td class="'+cls+'" data-label="'+h.label+'">'+val+'</td>';}).join('')+'</tr>';}).join('')+
            '</tbody></table></div></div>';
    }
    function bindEvents() {
        container.querySelectorAll('tbody tr').forEach(function(tr){tr.addEventListener('click',function(){var c=tr.dataset.code;if(c)location.hash='detail/'+c;});});
        container.querySelectorAll('th[data-sort]').forEach(function(th){th.addEventListener('click',function(){var k=th.dataset.sort;if(container._sortKey===k)container._sortDir*=-1;else{container._sortKey=k;container._sortDir=k==='score'?-1:1;}var sorted=container._results.slice().sort(function(a,b){var va=a[k]??0,vb=b[k]??0;if(typeof va==='string')return container._sortDir*va.localeCompare(vb);return container._sortDir*(va-vb);});container.innerHTML=buildTable(sorted);bindEvents();});});
    }
    container.innerHTML = buildTable(container._results); bindEvents();
}

// ── MULTIFACTOR PAGE ──
async function renderMultifactor(container) {
    var dw = {weight_momentum:0.30, weight_volatility:0.25, weight_volume:0.25, weight_reversion:0.20};
    var factorInfo = [
        {key:'weight_momentum',label:'动量趋势',hint:'近期涨幅越大得分越高'},
        {key:'weight_volatility',label:'低波动性',hint:'波动越小得分越高'},
        {key:'weight_volume',label:'量能活跃',hint:'成交越活跃得分越高'},
        {key:'weight_reversion',label:'均值回归',hint:'越接近均线得分越高'},
    ];
    container.innerHTML =
        '<div class="card"><div class="section-title">因子权重配置</div><div class="weight-grid">'+
        factorInfo.map(function(f){return '<div class="weight-item"><div class="weight-header"><label>'+f.label+'<small style="color:var(--text-secondary);font-weight:400;margin-left:4px">'+f.hint+'</small></label><span class="weight-val" id="mf-val-'+f.key+'">'+(dw[f.key]*100).toFixed(0)+'%</span></div><input type="range" id="mf-'+f.key+'" min="0" max="1" step="0.05" value="'+dw[f.key]+'"></div>';}).join('')+
        '</div><div style="margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">'+
        '<div class="filter-group"><label>返回数量</label><select id="mf-topn"><option value="20">前 20 名</option><option value="50" selected>前 50 名</option><option value="100">前 100 名</option></select></div>'+
        '<div class="filter-group"><label>&nbsp;</label><button class="btn btn-primary" id="mf-run">🔍 开始筛选</button></div>'+
        '<span style="font-size:0.8rem;color:var(--text-secondary)" id="mf-sum-hint">权重合计: 100%</span></div></div><div id="mf-results"></div>';
    Object.keys(dw).forEach(function(k){document.getElementById('mf-'+k).addEventListener('input',updateMfSum);});
    document.getElementById('mf-run').addEventListener('click', runMFScreening);
}
function updateMfSum() {
    var keys=['weight_momentum','weight_volatility','weight_volume','weight_reversion'],sum=0;
    keys.forEach(function(k){var el=document.getElementById('mf-'+k);if(el)sum+=parseFloat(el.value);});
    var h=document.getElementById('mf-sum-hint'), pct=(sum*100).toFixed(0);
    h.textContent='权重合计: '+pct+'%';
    h.style.color=Math.abs(sum-1)>0.08?'var(--up)':'var(--text-secondary)';
    keys.forEach(function(k){var el=document.getElementById('mf-val-'+k);if(el)el.textContent=(parseFloat(document.getElementById('mf-'+k).value)*100).toFixed(0)+'%';});
}
async function runMFScreening() {
    var btn=document.getElementById('mf-run'),rd=document.getElementById('mf-results');
    var keys=['weight_momentum','weight_volatility','weight_volume','weight_reversion'];
    var body={top_n:parseInt(document.getElementById('mf-topn').value),exclude_st:true};
    keys.forEach(function(k){body[k]=parseFloat(document.getElementById('mf-'+k).value);});
    btn.disabled=true;btn.innerHTML='<div class="spinner"></div> 筛选中';
    rd.innerHTML='<div class="card"><div class="loading-overlay"><div class="spinner"></div>正在多因子评分，请稍候...</div></div>';
    try{var data=await apiPost('/screen/multifactor',body);AppState.multifactorResults=data.results;renderMFResults(rd,data);}
    catch(e){rd.innerHTML='<div class="error-msg">多因子筛选失败<br><small>'+e.message+'</small></div>';}
    finally{btn.disabled=false;btn.innerHTML='🔍 开始筛选';}
}
function renderMFResults(container,data) {
    if(!data.results||data.results.length===0){container.innerHTML='<div class="card"><div class="empty-msg">📭 没有符合条件的股票</div></div>';return;}
    container._results=data.results;container._sortKey='score';container._sortDir=-1;
    var headers=[{key:'code',label:'代码'},{key:'name',label:'股票名称'},{key:'price',label:'最新价',fmt:formatPrice},{key:'change_pct',label:'涨跌幅',fmt:formatPct,cls:pctClass},{key:'score',label:'综合评分'},{key:'signal_strength',label:'推荐等级'}];
    function buildTable(results){return '<div class="card"><div class="stats-bar"><div class="stat-item"><span class="stat-label">扫描范围</span><span class="stat-value">'+data.total_scanned+' 支股票</span></div><div class="stat-item"><span class="stat-label">耗时</span><span class="stat-value">'+(data.elapsed_ms/1000).toFixed(1)+' 秒</span></div></div><div class="table-wrapper"><table class="result-table"><thead><tr>'+headers.map(function(h){var arrow=container._sortKey===h.key?(container._sortDir>0?' ▲':' ▼'):'';return '<th data-sort="'+h.key+'">'+h.label+arrow+'</th>';}).join('')+'</tr></thead><tbody>'+results.map(function(r){return '<tr data-code="'+r.code+'">'+headers.map(function(h){var val=r[h.key];if(h.key==='score')val=scoreBarHtml(val);else if(h.key==='signal_strength')val=badgeHtml(val);else if(h.fmt)val=h.fmt(val);if(val==null)val='-';var cls=h.cls?h.cls(r[h.key]):'';return '<td class="'+cls+'" data-label="'+h.label+'">'+val+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div></div>';}
    function bindEvents(){container.querySelectorAll('tbody tr').forEach(function(tr){tr.addEventListener('click',function(){var c=tr.dataset.code;if(c)location.hash='detail/'+c;});});container.querySelectorAll('th[data-sort]').forEach(function(th){th.addEventListener('click',function(){var k=th.dataset.sort;if(container._sortKey===k)container._sortDir*=-1;else{container._sortKey=k;container._sortDir=k==='score'?-1:1;}var sorted=container._results.slice().sort(function(a,b){var va=a[k]??0,vb=b[k]??0;if(typeof va==='string')return container._sortDir*va.localeCompare(vb);return container._sortDir*(va-vb);});container.innerHTML=buildTable(sorted);bindEvents();});});}
    container.innerHTML=buildTable(container._results);bindEvents();
}

// ── DETAIL PAGE ──
async function renderDetail(container, code) {
    container.innerHTML = '<div class="card"><div class="loading-overlay"><div class="spinner"></div>正在加载 '+code+' 的行情数据...</div></div>';
    try {
        var results = await Promise.all([apiGet('/stocks/'+code+'/history?days=120'), apiGet('/stocks/'+code+'/indicators')]);
        var hist = results[0], ind = results[1];
        AppState.currentStock = {code:code, history:hist, indicators:ind};
        var candles = hist.candles;
        var lastPrice = candles[candles.length-1]?.close ?? 0;
        var prevPrice = candles[candles.length-2]?.close ?? lastPrice;
        var chg = lastPrice - prevPrice, chgPct = prevPrice ? (chg/prevPrice*100) : 0;
        container.innerHTML =
            '<div class="detail-header">'+
            '<a class="back-link" onclick="window.history.back()">← 返回列表</a>'+
            '<span class="stock-name">'+hist.name+'</span><span class="stock-code">'+hist.code+'</span>'+
            '<span class="stock-price '+pctClass(chgPct)+'">¥'+formatPrice(lastPrice)+'</span>'+
            '<span class="stock-change '+pctClass(chgPct)+'">'+(chg>=0?'+':'')+chg.toFixed(2)+' ('+(chgPct>=0?'+':'')+chgPct.toFixed(2)+'%)</span>'+
            '</div>'+
            '<div class="card"><div class="chart-container" id="main-chart"></div><div class="chart-sub" id="volume-chart"></div><div class="chart-sub" id="rsi-chart"></div></div>'+
            '<div class="card"><div class="section-title">技术指标</div><div class="indicator-grid">'+
            buildIndCard('相对强弱 RSI(6)', ind.rsi, function(v){return v!=null?v.toFixed(1):'-';})+
            buildIndCard('5日均线 MA5', ind.ma5, formatPrice)+buildIndCard('20日均线 MA20', ind.ma20, formatPrice)+buildIndCard('60日均线 MA60', ind.ma60, formatPrice)+
            buildIndCard('偏离 MA20', ind.deviation_ma20, formatPct, 0)+buildIndCard('成交量比', ind.volume_ratio, formatNum)+
            buildIndCard('5日涨跌', ind.change_5d, formatPct)+buildIndCard('20日涨跌', ind.change_20d, formatPct)+buildIndCard('年化波动率', ind.volatility_20d, formatPct)+
            '</div></div>';
        requestAnimationFrame(async function() {
            var me=document.getElementById('main-chart'), ve=document.getElementById('volume-chart'), re=document.getElementById('rsi-chart');
            try { await createStockChart(me, candles, ind); await createVolumeChart(ve, candles); await createRSIChart(re, candles, 6); }
            catch(e) { if(me) me.innerHTML = '<div class="empty-msg">📊 K线图表加载失败<br><small>CDN 不可用，请检查网络</small></div>'; if(ve) ve.style.display='none'; if(re) re.style.display='none'; }
        });
    } catch(e) {
        container.innerHTML = '<div class="error-msg">加载股票数据失败<br><small>'+e.message+'</small><br><a href="#screener">← 返回筛选</a></div>';
    }
}
function buildIndCard(label, value, fmt, threshold) {
    var dv = value != null ? fmt(value) : '-', cc = '';
    if (threshold != null && value != null) cc = value >= threshold ? 'price-up' : 'price-down';
    return '<div class="indicator-card"><div class="ind-label">'+label+'</div><div class="ind-value '+cc+'">'+dv+'</div></div>';
}

// ── ROUTER ──
function handleRoute() {
    var hash = location.hash.slice(1) || 'screener';
    var content = document.getElementById('app-content');
    document.querySelectorAll('.nav-link').forEach(function(a){a.classList.toggle('active', a.getAttribute('href')==='#'+hash.split('/')[0]);});
    content.innerHTML = '<div class="loading-overlay"><div class="spinner"></div>加载中...</div>';
    if (hash === 'screener') renderScreener(content);
    else if (hash === 'multifactor') renderMultifactor(content);
    else if (hash.startsWith('detail/')) renderDetail(content, hash.split('/')[1]);
    else if (hash === 'about') content.innerHTML = '<div class="card about-card"><h2>关于选股小程序</h2><p>一款基于技术指标和多因子模型的 A 股智能选股工具。</p><p style="margin-top:10px"><strong>核心功能</strong></p><ul><li><strong>技术筛选</strong> — 6 种短线策略：均线偏离、RSI 超卖、放量突破、动量强度、超跌反弹、跳空回补</li><li><strong>多因子评分</strong> — 动量趋势、低波动性、量能活跃、均值回归四维综合排名</li><li><strong>个股详情</strong> — K 线图表、成交量、RSI 指标、均线系统</li></ul><div class="disclaimer">⚠️ <strong>免责声明：</strong>本工具仅供学习研究，所有数据来源于 akshare（新浪/腾讯），不构成任何投资建议。股市有风险，投资需谨慎。</div></div>';
    else content.innerHTML = '<div class="error-msg">页面不存在: '+hash+'</div>';
}
window.addEventListener('hashchange', handleRoute);
try { handleRoute(); } catch(e) { var el = document.getElementById('app-content'); if (el) el.innerHTML = '<div class="error-msg"><b>严重错误</b><br>'+e.message+'</div>'; }
</script>
